:root{
  --zumrut:#12463A; --zumrut-koyu:#0C332B; --cini:#2E9C87; --cini-koyu:#1F7A69;

*{box-sizing:border-box; margin:0}
.app{

  padding:0 14px 46px; display:flex; justify-content:center;
}
.app.kid{
  font-family:'Baloo 2','Nunito Sans',sans-serif;

.shell{width:100%; max-width:430px}

button{font-family:inherit}

.hero{
  position:relative; margin-top:26px; background:var(--sayfa);
  border:1px solid rgba(194,160,80,.55); border-radius:170px 170px 22px 22px;
  padding:48px 22px 20px; text-align:center; box-shadow:0 18px 44px rgba(0,0,0,.3);
}
.hero::before{
  content:""; position:absolute; inset:8px; pointer-events:none;
  border:1px solid rgba(194,160,80,.45); border-radius:160px 160px 16px 16px;
}
.brand{font-family:'Cormorant Garamond',serif; font-weight:700; font-size:46px; color:var(--zumrut); line-height:1}
.brand-tag{margin-top:6px; font-size:13px; color:var(--soluk)}
.statrow{display:flex; justify-content:center; gap:18px; margin-top:14px; font-size:12.5px; font-weight:700}
.stat{color:var(--altin-koyu)}
.stat b{font-family:'Cormorant Garamond',serif; font-size:20px; color:var(--zumrut); margin-right:4px}
.mode-link{
  margin-top:14px; border:1.5px dashed var(--altin); background:transparent; color:var(--altin-koyu);
  font-weight:800; font-size:13px; padding:9px 18px; border-radius:999px; cursor:pointer;
}
.hero-links{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:14px}

/* \u2014\u2014\u2014 Kald\u0131\u011F\u0131n yer / G\xFCn\xFCn ayeti / Namaz kartlar\u0131 \u2014\u2014\u2014 */
.resume-card{
  display:flex; align-items:center; gap:12px; width:100%; text-align:left; margin-top:12px;
  padding:14px; border-radius:16px; border:0; cursor:pointer; background:var(--sayfa); box-shadow:0 8px 20px rgba(0,0,0,.18);
}
.resume-tag{font-size:10.5px; font-weight:800; color:var(--cini-koyu); text-transform:uppercase; letter-spacing:.06em}
.resume-name{font-family:'Cormorant Garamond',serif; font-size:19px; font-weight:700; color:var(--murekkep); display:block; margin-top:2px}
.voday-card{background:var(--sayfa); border-radius:16px; padding:16px; margin-top:12px; box-shadow:0 8px 20px rgba(0,0,0,.18)}
.voday-tag{font-size:10.5px; font-weight:800; color:var(--altin-koyu); text-transform:uppercase; letter-spacing:.06em}
.voday-ar{
  font-family:'Amiri',serif; font-size:26px; line-height:1.9; margin-top:10px;
  direction:rtl; text-align:right; color:var(--murekkep);
}
.voday-t{font-family:'Cormorant Garamond',serif; font-size:21px; font-weight:600; margin-top:6px}
.voday-m{font-size:13px; color:var(--soluk); font-style:italic; margin-top:6px}
.voday-src{font-size:11.5px; color:var(--soluk); margin-top:8px}
.namaz-btn{
  display:flex; align-items:center; justify-content:space-between; width:100%; margin-top:12px;
  padding:14px 16px; border-radius:16px; border:0; cursor:pointer; background:var(--zumrut); color:var(--sayfa);
  font-weight:800; font-size:14px;
}
.namaz-next{font-size:11.5px; color:#CFE3DC; font-weight:700; margin-top:2px; display:block}
.quran-btn{background:var(--cini-koyu)}

/* \u2014\u2014\u2014 Ana ekran 2x2 kare men\xFC \u2014\u2014\u2014 */
.nav-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px}
.nav-tile{
  aspect-ratio:1/0.92; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:5px; background:var(--sayfa); border-radius:18px; border:0; cursor:pointer; padding:10px;
  box-shadow:0 8px 20px rgba(0,0,0,.18); text-align:center;
}
.nav-tile-icon{font-size:30px}
.nav-tile-title{font-family:'Cormorant Garamond',serif; font-size:16px; font-weight:700; color:var(--murekkep); line-height:1.2}
.nav-tile-sub{font-size:10.5px; color:var(--soluk); font-weight:700}

/* \u2014\u2014\u2014 Kur'an-\u0131 Kerim listesi \u2014\u2014\u2014 */
.quran-search{
  width:100%; margin-top:12px; padding:12px 14px; border-radius:12px; border:1px solid var(--cizgi);
  font-size:14px; background:var(--sayfa);
}
.surah-row{
  display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:13px 4px;
  background:transparent; border:0; border-bottom:1px dashed var(--cizgi); cursor:pointer;
}
.surah-row:last-child{border-bottom:0}
.surah-badge{
  flex-shrink:0; width:34px; height:34px; border-radius:50%; background:var(--sayfa-2); border:1.5px solid var(--altin);
  display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; color:var(--altin-koyu);
}
.surah-main{flex:1; min-width:0}
.surah-name-tr{font-family:'Cormorant Garamond',serif; font-size:18px; font-weight:700; color:var(--murekkep); display:block}
.surah-name-ar{font-family:'Amiri',serif; font-size:20px; color:var(--soluk)}
.surah-meta{font-size:11.5px; color:var(--soluk)}

/* \u2014\u2014\u2014 S\xFBre okuma ekran\u0131 \u2014\u2014\u2014 */
.quran-ayah{padding:16px 2px; border-bottom:1px dashed var(--cizgi)}
.quran-ayah:last-child{border-bottom:0}
.quran-ayah.playing{background:rgba(194,160,80,.1); border-radius:10px; margin:0 -8px; padding:16px 8px}
.quran-ayah-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}

/* \u2014\u2014\u2014 Namaz Vakitleri ekran\u0131 \u2014\u2014\u2014 */
.prayer-list{margin-top:14px}
.prayer-row{
  display:flex; justify-content:space-between; align-items:center; padding:13px 4px;
  border-bottom:1px dashed var(--cizgi); font-weight:700;
}
.prayer-row:last-child{border-bottom:0}
.prayer-row.next{background:rgba(194,160,80,.12); border-radius:10px; margin:0 -8px; padding:13px 8px}
.prayer-name{font-family:'Cormorant Garamond',serif; font-size:19px; color:var(--murekkep)}
.prayer-time{font-size:18px; color:var(--altin-koyu); font-variant-numeric:tabular-nums}
.prayer-loc{font-size:12.5px; color:var(--soluk); text-align:center; margin-top:6px}
.city-form{display:flex; gap:8px; margin-top:14px}
.city-input{flex:1; padding:10px 12px; border-radius:10px; border:1px solid var(--cizgi); font-size:14px}
.ezan-toggle{
  display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; margin-top:12px;
  padding:14px; border-radius:16px; border:0; cursor:pointer; background:var(--sayfa); box-shadow:0 8px 20px rgba(0,0,0,.18);
  text-align:left;
}
.switch{
  flex-shrink:0; width:46px; height:26px; border-radius:999px; background:var(--sayfa-2);
  border:1.5px solid var(--cizgi); position:relative; transition:background .15s ease;
}
.switch .knob{
  position:absolute; top:2px; left:2px; width:19px; height:19px; border-radius:50%;
  background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.3); transition:transform .15s ease;
}
.switch.on{background:var(--cini); border-color:var(--cini)}
.switch.on .knob{transform:translateX(20px)}

/* \u2014\u2014\u2014 B\xF6l\xFCm ba\u015Fl\u0131klar\u0131 \u2014\u2014\u2014 */
.eyebrow{
  display:flex; align-items:center; gap:10px; margin:24px 4px 4px;
  color:#E9DFC6; font-size:11.5px; font-weight:800; letter-spacing:.2em; text-transform:uppercase;
}
.eyebrow::after{content:""; flex:1; height:1px; background:linear-gradient(to right, rgba(194,160,80,.75), transparent)}
.app.kid .eyebrow{color:#C7D2FF; letter-spacing:.14em}
.app.kid .eyebrow::after{background:linear-gradient(to right, rgba(255,209,102,.7), transparent)}

/* \u2014\u2014\u2014 Kartlar ve listeler (yeti\u015Fkin) \u2014\u2014\u2014 */
.card{background:var(--sayfa); border:1px solid var(--cizgi); border-radius:18px; padding:6px 14px; margin-top:12px; box-shadow:0 10px 26px rgba(0,0,0,.2)}
.card.pad{padding:16px}
.row{
  display:flex; align-items:center; gap:12px; width:100%; text-align:left;
  padding:13px 2px; background:transparent; border:0; border-bottom:1px dashed var(--cizgi); cursor:pointer;
}
.row:last-child{border-bottom:0}
.row-name{font-family:'Cormorant Garamond',serif; font-size:19px; font-weight:700; color:var(--murekkep)}
.row-sub{font-size:12px; color:var(--soluk); margin-top:1px}
.row-main{flex:1; min-width:0}
.pill{font-size:10.5px; font-weight:800; padding:4px 10px; border-radius:999px; white-space:nowrap}
.pill.due{background:rgba(184,92,65,.13); color:var(--mercan)}
.pill.new{background:rgba(46,156,135,.13); color:var(--cini-koyu)}
.pill.lvl{background:rgba(194,160,80,.16); color:var(--altin-koyu)}
.dots{display:flex; gap:4px; margin-top:6px}
.dot{width:7px; height:7px; transform:rotate(45deg); background:var(--sayfa-2); border:1px solid var(--cizgi)}
.dot.on{background:var(--altin); border-color:var(--altin)}

.note{font-size:12.5px; color:#D8CEB4; line-height:1.55; margin-top:14px; padding:0 6px}

/* \u2014\u2014\u2014 \u0130\xE7 sayfa (yeti\u015Fkin) \u2014\u2014\u2014 */
.back{
  display:flex; align-items:center; gap:6px; margin-top:12px; padding:10px 2px;
  background:transparent; border:0; color:#EDE4CC; font-weight:800; font-size:14px; cursor:pointer;
}
.item-head{margin-top:2px; text-align:center}
.item-title{font-family:'Cormorant Garamond',serif; font-size:32px; font-weight:700; color:var(--sayfa)}
.item-sub{font-size:12.5px; color:#CFC5A9; margin-top:2px}
.tabs{display:flex; background:rgba(251,246,234,.12); border-radius:999px; padding:4px; margin-top:14px}
.tab{flex:1; border:0; background:transparent; color:#EDE4CC; padding:9px 0; border-radius:999px; font-weight:800; font-size:13px; cursor:pointer}
.tab.on{background:var(--sayfa); color:var(--zumrut)}

.verse{display:flex; gap:12px; padding:14px 2px; border-bottom:1px dashed var(--cizgi); align-items:flex-start}
.verse-playing{background:rgba(194,160,80,.1); border-radius:10px; margin:0 -8px; padding:14px 8px}
.audio-note{font-size:11.5px; color:var(--soluk); text-align:center; margin-bottom:6px}
.playall-btn{
  display:block; width:100%; margin-bottom:14px; padding:12px; border-radius:12px; border:0;
  background:var(--zumrut); color:var(--sayfa); font-weight:800; font-size:14px; cursor:pointer;
}
.verse-audio audio{display:none}
.verse-audio{display:flex; flex-direction:column; align-items:center; gap:2px; flex-shrink:0; margin-top:2px}
.verse-play{
  width:34px; height:34px; border-radius:50%; border:1.5px solid var(--altin);
  background:var(--sayfa-2); color:var(--altin-koyu); font-size:12px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.verse-play.on{background:var(--altin); color:var(--sayfa)}
.audio-fail{font-size:9.5px; color:var(--mercan); white-space:nowrap}
.verse:last-child{border-bottom:0}
.verse-t{font-family:'Cormorant Garamond',serif; font-size:22px; line-height:1.45; font-weight:600; overflow-wrap:break-word; word-break:break-word}
.verse-m{margin-top:6px; font-size:13.5px; color:var(--soluk); font-style:italic; line-height:1.5}
.toggle{
  width:100%; margin-top:12px; padding:10px; border-radius:12px; cursor:pointer;
  background:var(--sayfa-2); border:1px solid var(--cizgi); color:var(--altin-koyu); font-weight:800; font-size:13px;
}

.btn{border:0; border-radius:13px; padding:14px 16px; font-weight:800; font-size:14.5px; cursor:pointer; transition:transform .12s ease}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--zumrut); color:var(--sayfa); width:100%}
.btn-cini{background:var(--cini); color:#fff}
.btn-mercan{background:var(--mercan); color:#fff}
.btn-ghost{background:transparent; color:var(--zumrut); border:1.5px solid var(--cizgi)}
.btn-row{display:flex; gap:10px; margin-top:14px}
.btn-row .btn{flex:1}

.mini-progress{display:flex; justify-content:center; gap:6px; margin-top:14px}
.mini{width:9px; height:9px; transform:rotate(45deg); background:rgba(251,246,234,.2); border:1px solid rgba(251,246,234,.35)}
.mini.on{background:var(--altin); border-color:var(--altin)}
.stage-hint{font-size:12.5px; color:var(--soluk); margin-top:10px; text-align:center}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:4px}
.chip{
  border:1.5px dashed var(--altin); background:var(--sayfa-2); color:var(--altin-koyu);
  padding:8px 12px; border-radius:10px; font-weight:700; font-size:16px; cursor:pointer;
  font-family:'Cormorant Garamond',serif; transition:background .15s ease;
}
.chip.open{border-style:solid; background:#fff; color:var(--murekkep)}

.veil{
  margin-top:4px; padding:28px 14px; border-radius:12px; text-align:center;
  color:var(--soluk); font-size:13px; border:1px dashed var(--cizgi);
  background:repeating-linear-gradient(-45deg, var(--sayfa-2), var(--sayfa-2) 8px, #EBE2CC 8px, #EBE2CC 16px);
}
.score{
  width:118px; height:118px; margin:10px auto 4px; border-radius:50%;
  border:3px solid var(--altin); display:flex; flex-direction:column; align-items:center; justify-content:center;
}
.score b{font-family:'Cormorant Garamond',serif; font-size:34px; color:var(--zumrut)}
.score span{font-size:11px; color:var(--soluk); font-weight:700; letter-spacing:.08em; text-transform:uppercase}
.result-msg{text-align:center; font-size:14px; line-height:1.55; color:var(--murekkep); margin-top:10px}
.result-next{text-align:center; font-size:12.5px; color:var(--altin-koyu); font-weight:800; margin-top:8px}

.center{text-align:center}
.loading{color:#EDE4CC; text-align:center; padding-top:60px; font-size:14px}

/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 \xC7OCUK MODU \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */
.ktop{display:flex; align-items:center; justify-content:space-between; margin-top:16px}
.ktitle{font-weight:800; font-size:24px; color:#fff}
.mode-pill{
  border:0; background:rgba(255,255,255,.14); color:#DDE5FF; font-weight:700; font-size:12px;
  padding:8px 14px; border-radius:999px; cursor:pointer;
}
.khero{
  margin-top:14px; padding:18px; border-radius:26px; color:#fff;
  background:linear-gradient(180deg, #2E4390, #22346F);
  border:2px solid rgba(255,209,102,.45); box-shadow:0 14px 34px rgba(0,0,0,.4);
  display:flex; gap:12px; align-items:center;
}
.kbubble{
  position:relative; flex:1; background:#fff; color:#33406B; border-radius:16px;
  padding:10px 14px; font-weight:700; font-size:14.5px; line-height:1.45;
}
.kbubble::before{
  content:""; position:absolute; left:-7px; top:20px;
  border:8px solid transparent; border-right-color:#fff; border-left:0;
}
.kstat{margin-top:10px; text-align:center; color:var(--kstar); font-weight:800; font-size:14px}

.stars-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin-top:10px}
.star-btn{
  display:flex; flex-direction:column; align-items:center; gap:5px; cursor:pointer;
  background:rgba(255,255,255,.07); border:1.5px solid rgba(255,255,255,.14);
  border-radius:18px; padding:12px 6px 10px; color:#EAF0FF;
}
.star-btn.due{border-color:rgba(255,209,102,.65); background:rgba(255,209,102,.1)}
.sname{font-size:11.5px; font-weight:700; line-height:1.2; text-align:center}
.stag{font-size:10px; font-weight:800; color:var(--kstar)}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.14); filter:brightness(1.3)}}

.kcard{
  background:#fff; border-radius:24px; padding:18px; margin-top:14px; color:var(--kink);
  box-shadow:0 12px 32px rgba(0,0,0,.4);
}
.kback{
  display:flex; align-items:center; gap:6px; margin-top:14px; padding:8px 2px;
  background:transparent; border:0; color:#DDE5FF; font-weight:800; font-size:14px; cursor:pointer;
}
.kitem-title{color:#fff; font-weight:800; font-size:22px; text-align:center}
.kverse{font-size:23px; font-weight:800; line-height:1.5; color:var(--kink)}
.kmeal{font-size:13.5px; color:var(--ksoluk); margin-top:8px; line-height:1.5}
.khint{font-size:13.5px; color:var(--ksoluk); font-weight:700; text-align:center; margin-top:4px}

.kbtn{
  width:100%; margin-top:16px; border:0; border-radius:999px; padding:15px;
  font-weight:800; font-size:16.5px; cursor:pointer; font-family:inherit; transition:transform .1s ease;
}
.kbtn-gold{background:var(--kstar); color:#5A430A; box-shadow:0 4px 0 var(--kstar-koyu)}
.kbtn-gold:active{transform:translateY(2px); box-shadow:0 2px 0 var(--kstar-koyu)}
.kbtn-ghost{background:#EFF2FB; color:#54619A}
.kbtn-row{display:flex; gap:10px}
.kbtn-row .kbtn{flex:1}

.slots{
  display:flex; flex-wrap:wrap; gap:8px; align-items:center;
  background:#F4F6FE; border-radius:16px; padding:12px; min-height:56px; margin-top:12px;
}
.slot-empty{
  border:2px dashed #B9C2E8; border-radius:12px; padding:9px 16px;
  color:#B9C2E8; font-weight:800; font-size:16px;
}
.pool{display:flex; flex-wrap:wrap; gap:9px; justify-content:center; margin-top:16px}
.kchip{
  border:0; background:#fff; border-radius:14px; padding:11px 15px; cursor:pointer;
  font-weight:800; font-size:17px; color:var(--kink); font-family:inherit;
  box-shadow:0 3px 0 #D7DCF0; transition:transform .1s ease;
}
.kchip:active{transform:translateY(2px); box-shadow:0 1px 0 #D7DCF0}
.kchip.placed{background:var(--kstar); box-shadow:0 3px 0 var(--kstar-koyu); color:#5A430A; cursor:default}
.kchip.shake{animation:shake .4s ease; background:#FFD9D2; box-shadow:0 3px 0 #EFB3A6}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

.kprog{display:flex; gap:7px; justify-content:center; margin-top:14px}

.confetti-wrap{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:50}
.cf{position:absolute; top:-5vh; width:10px; height:15px; border-radius:3px; animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(720deg)}}

/* \u2014\u2014\u2014 Elif-Ba Yolu \u2014\u2014\u2014 */
.path-grid{display:grid; grid-template-columns:repeat(4, 1fr); gap:10px; margin-top:10px}
.node{
  display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer;
  background:rgba(255,255,255,.07); border:1.5px solid rgba(255,255,255,.14);
  border-radius:18px; padding:12px 4px 10px; color:#EAF0FF;
}
.node:disabled{opacity:.4; cursor:default}
.node.done{border-color:rgba(255,209,102,.5)}
.node-icon{
  width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-family:'Amiri',serif; font-size:20px; font-weight:700; color:#fff; direction:rtl;
  background:rgba(255,255,255,.12); border:1.5px solid rgba(255,255,255,.3);
}
.node.done .node-icon{background:var(--kstar); color:#5A430A; border-color:var(--kstar-koyu); font-family:inherit; font-size:19px}
.node.next .node-icon{border-color:var(--kstar)}
.badge-banner{
  margin-top:10px; padding:13px 16px; border-radius:18px; text-align:center;
  background:rgba(255,209,102,.14); border:1.5px dashed rgba(255,209,102,.6);
  color:#FFE7AE; font-weight:800; font-size:14px; line-height:1.45;
}
.glyph-big{
  font-family:'Amiri',serif; font-size:96px; line-height:1.15; text-align:center;
  color:var(--kink); direction:rtl; margin-top:4px;
}
.glyph-name{text-align:center; font-size:23px; font-weight:800; color:var(--kstar-koyu); margin-top:2px}
.opt-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px}
.opt{
  border:0; border-radius:14px; padding:14px 8px; cursor:pointer; font-family:inherit;
  font-weight:800; font-size:17px; background:#EFF2FB; color:#54619A; box-shadow:0 3px 0 #D7DCF0;
  transition:transform .1s ease;
}
.opt:active{transform:translateY(2px); box-shadow:0 1px 0 #D7DCF0}
.opt.good{background:#6EE7B7; color:#065F46; box-shadow:0 3px 0 #34B98A}
.opt.shake{animation:shake .4s ease; background:#FFD9D2; box-shadow:0 3px 0 #EFB3A6}
.ebadge{
  width:110px; height:110px; margin:8px auto 4px; border-radius:50%;
  background:var(--kstar); border:4px solid var(--kstar-koyu);
  display:flex; align-items:center; justify-content:center;
  font-family:'Amiri',serif; font-size:48px; font-weight:700; color:#5A430A;
}
.feature-row{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px}
.feature-btn{
  border:1.5px solid rgba(255,255,255,.16); border-radius:20px; padding:14px;
  text-align:left; cursor:pointer; background:rgba(255,255,255,.08); color:#fff; font-family:inherit;
}
.feature-btn b{display:block; font-size:15px; margin-bottom:3px}
.feature-btn span{font-size:11.5px; color:#C7D2FF; line-height:1.35; display:block}
.rrow{display:flex; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px dashed #E5E9F7; font-size:14px}
.rrow:last-child{border-bottom:0}
.rrow b{font-weight:800}
.rval{color:var(--ksoluk); font-weight:700; text-align:right; white-space:nowrap}
.rval.ok{color:#1E9E76}
.rhead{font-size:16px; font-weight:800; margin-bottom:4px}
